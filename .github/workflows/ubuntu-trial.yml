name: Ubuntu trial package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu-trial.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build-ubuntu-package:
    name: Build Ubuntu 24.04 x64 package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out BibleShow
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri and GStreamer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Build Debian package
        run: cargo tauri build --bundles deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: BibleShow-ubuntu-24.04-x64-trial
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
